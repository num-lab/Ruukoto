name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22.19.0, 24.15.0]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            verification/foundation/package-lock.json
      # Note: 见 .agents/notes/implemented/testing/2026-10-22-ci-prerequisites.md
      - name: 安装 Linux 检查前提
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep bubblewrap apparmor dbus-user-session
          test ! -e /etc/apparmor.d/ruukoto-bwrap
          sudo install -m 0644 deploy/native/ruukoto-bwrap /etc/apparmor.d/ruukoto-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/ruukoto-bwrap
          run_uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$run_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$run_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          /usr/bin/bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
          systemd-run --user --scope --quiet --property=Delegate=yes true
      - name: 安装 macOS 检查前提
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: npm run setup -- --skip-hooks
      - run: npm run check
