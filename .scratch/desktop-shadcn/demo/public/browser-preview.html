<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fumotravel · 预览</title><style>
:root{color-scheme:light dark;font:14px/1.6 system-ui,sans-serif;background:light-dark(#fafafa,#0a0a0a);color:light-dark(#171717,#fafafa)}*{box-sizing:border-box}body{margin:0;padding:28px 20px}header{font-size:12px;color:light-dark(#737373,#a3a3a3)}h1{margin:24px 0 6px;font-size:23px;font-weight:550}p{color:light-dark(#737373,#a3a3a3)}section{margin-top:26px;border:1px solid light-dark(#e5e5e5,#262626);padding:20px;border-radius:12px}h2{margin:0;font-size:19px;font-weight:500}dl{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}dt{font-size:11px;color:light-dark(#737373,#a3a3a3)}dd{margin:4px 0 0}button{background:light-dark(#171717,#e5e5e5);color:light-dark(#fafafa,#171717);border:0;border-radius:7px;padding:8px 12px;cursor:pointer}button:focus-visible{outline:2px solid #737373;outline-offset:3px}small{display:block;margin-top:24px;color:light-dark(#737373,#a3a3a3)}
</style></head><body><header>Fumotravel / 本地预览</header><h1 id="heading">你的新干线行程</h1><p>离线时也能查看缓存车票。</p><section><h2>Tokyo → Kyoto</h2><dl><div><dt>出发时间</dt><dd>09:07 JST</dd></div><div><dt>预留座位</dt><dd>12A</dd></div></dl><p id="status" aria-live="polite">在线 · 数据已同步</p><button id="toggle" type="button">切换离线状态</button></section><small>演示车票，无真实订单。</small><script>
let offline=false;document.getElementById('toggle').addEventListener('click',()=>{offline=!offline;document.getElementById('status').textContent=offline?'离线 · 使用本地缓存':'在线 · 数据已同步'});if(new URLSearchParams(location.search).get('view')==='cache')document.getElementById('heading').textContent='本地缓存车票';
</script></body></html>
