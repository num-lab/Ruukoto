<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;height:100%;font:14px -apple-system,sans-serif}
body{display:flex}
#chat{flex:1;padding:12px;background:#f5f5f7;box-sizing:border-box}
#pane{width:45%;background:#d8dee9;transition:width .18s ease}
#pane.closed{width:0}
</style>
<div id="chat">探针前端页（模拟聊天区）</div>
<div id="pane"></div>
<script>
window.__events = [];
try {
  mygo.on("probe:mark", function (e) {
    window.__events.push(e);
    mygo.call("Probe.Report", "mark", e).catch(function () {});
  });
} catch (e) {}
var pane = document.getElementById("pane");
var report = function () {
  var r = pane.getBoundingClientRect();
  if (window.mygo) {
    mygo.call("Probe.SetRect", { x: r.x, y: r.y, w: r.width, h: r.height }).catch(function () {});
  }
};
new ResizeObserver(report).observe(pane);
report();
window.__collapse = function (v) { pane.classList.toggle("closed", !!v); };
window.__rect = function () { var r = pane.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
</script>
