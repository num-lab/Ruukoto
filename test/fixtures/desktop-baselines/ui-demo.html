    // Page Type 3: Single Sub-Agent Inspector Page (Message Stream Style, No Bottom Composer)
    function renderSingleAgentPage(sess, tab, container) {
      const subagents = sess.subagents || [];
      const ag = subagents.find(a => a.id === tab.agentId || a.name === tab.title) || subagents[0];

      if (!ag) {
        container.innerHTML = `
          <div class="h-44 flex items-center justify-center text-[12.5px] text-mut">
            Sub-agent finished or closed
          </div>
        `;
        return;
      }

      const dot =
        ag.status === 'running'
          ? `<span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-calm-pulse shrink-0"></span>`
          : `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>`;

      const steps = ag.steps || [
        { type: 'user', text: ag.task || '' }
      ];

      let streamHtml = '';
      steps.forEach((step, sIdx) => {
        if (step.type === 'user') {
          streamHtml += `
            <div class="flex justify-end">
              <div class="surface-user-bubble w-fit max-w-[85%] rounded-[14px] px-3.5 py-2.5 text-[12.5px] leading-relaxed break-words">
                ${escapeHtml(step.text)}
              </div>
            </div>
          `;
        } else if (step.type === 'activity') {
          let detailsHtml = '';
          if (step.expanded && step.items) {
            const rows = step.items
              .map(
                item => `
                <div
                  onclick="${item.diffFile ? `openDiffFile('${item.diffFile}')` : ''}"
                  class="flex items-center justify-between py-1 px-2 rounded-[7px] text-[11.5px] ${item.diffFile ? 'cursor-pointer hover-pill' : ''}"
                >
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-mut w-10 shrink-0">${escapeHtml(item.action)}</span>
                    <span class="font-mono text-pri truncate">${escapeHtml(item.file)}</span>
                  </div>
                  <div class="font-mono text-[10.5px] text-mut shrink-0 ml-2">
                    ${escapeHtml(item.note || '')}
                  </div>
                </div>
              `
              )
              .join('');
            detailsHtml = `<div class="pl-4 space-y-0.5 pt-0.5">${rows}</div>`;
          }

          streamHtml += `
            <div class="space-y-1">
              <button
                onclick="toggleSubagentActivity('${ag.id}', ${sIdx})"
                class="group flex items-center gap-2 text-[12px] text-sec hover:text-pri transition-colors py-0.5 text-left"
              >
                <svg class="w-3 h-3 text-mut transition-transform duration-150 shrink-0 ${step.expanded ? 'rotate-90' : ''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                  <path d="M6 4L10 8L6 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>${escapeHtml(step.summary)}</span>
                <span class="text-mut font-mono text-[10.5px] shrink-0">· ${escapeHtml(step.duration)}</span>
              </button>
              ${detailsHtml}
            </div>
          `;
        } else if (step.type === 'prose') {
          streamHtml += `
            <div class="text-[12.5px] text-pri leading-[1.65]">
              ${formatProse(step.text)}
            </div>
          `;
        }
      });

      container.innerHTML = `
        <!-- Quiet Sub-Agent Meta Header -->
        <div class="flex items-center justify-between gap-2 px-1.5 pb-2.5 shrink-0">
          <div class="flex items-center gap-2 min-w-0">
            ${dot}
            <span class="text-[12px] font-medium text-pri truncate">${escapeHtml(ag.name)}</span>
            <span class="text-[11px] text-mut truncate">· ${escapeHtml(ag.role)}</span>
          </div>
          <span class="text-[11px] font-mono text-mut shrink-0">${escapeHtml(ag.duration)}</span>
        </div>

        <!-- Read-Only Message Stream (Same style as center stream, no bottom composer) -->
        <div class="flex-1 overflow-y-auto px-1.5 pt-2 pb-4 space-y-5 selectable-text">
          ${streamHtml}
        </div>
      `;
    }

    function toggleSubagentActivity(agentId, stepIdx) {
      const sess = getActiveSession();
      const ag = (sess.subagents || []).find(a => a.id === agentId);
      if (!ag || !ag.steps || !ag.steps[stepIdx]) return;
      ag.steps[stepIdx].expanded = !ag.steps[stepIdx].expanded;
      renderRightSidebar();
    }

    function toggleBrowserOfflineSim() {
      state.browserOfflineSimulated = !state.browserOfflineSimulated;
      renderRightSidebar();
      showToast(state.browserOfflineSimulated ? 'Simulating offline tunnel in Browser' : 'Browser network restored');
    }

    function reloadBrowserPreview() {
      const icon = document.getElementById('browserReloadIcon');
      if (icon) {
        icon.style.transform = 'rotate(360deg)';
        setTimeout(() => {
          icon.style.transform = '';
        }, 320);
      }
      showToast('Preview reloaded');
    }

    function spawnSubagent() {
      const sess = getActiveSession();
      if (!sess.subagents) sess.subagents = [];
      const newAg = {
        id: 'ag-' + Date.now().toString().slice(-3),
        name: 'Type Checker',
        role: 'Verification',
        status: 'running',
        duration: '0.4s',
        task: 'Verify strict TypeScript / Rust diagnostics across modified files.',
        steps: [
          {
            type: 'user',
            text: 'Verify strict TypeScript / Rust diagnostics across modified files.'
          },
          {
            type: 'activity',
            summary: 'Checking workspace diagnostics...',
            duration: '0.4s',
            expanded: true,
            items: [
              { action: 'Check', file: 'tsconfig.json', note: 'strict: true' }
            ]
          }
        ]
      };
      sess.subagents.unshift(newAg);

      openOrFocusRightTab({
        type: 'agent',
        title: newAg.name,
        agentId: newAg.id
      });
      showToast('Opened Type Checker in new tab');

      setTimeout(() => {
        newAg.status = 'done';
        newAg.duration = '1.2s';
        newAg.steps[1].summary = 'Checked 2 modified files, 0 errors';
        newAg.steps[1].duration = '1.2s';
        newAg.steps[1].expanded = false;
        newAg.steps.push({
          type: 'prose',
          text: 'Verified strict type diagnostics across all modified files in the current session with **0 errors**.'
        });
        renderRightSidebar();
      }, 1400);
    }

    function acceptDiffByPath(fullPath) {
      const sess = getActiveSession();
      const target = (sess.diffs || []).find(d => d.fullPath === fullPath);
      if (!target) return;
      target.accepted = true;
      renderRightSidebar();
      showToast(`Accepted ${target.file}`);
    }

    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      document.getElementById('leftSidebar').classList.toggle('hidden', !state.sidebarOpen);
      document.getElementById('openSidebarBtn').classList.toggle('hidden', state.sidebarOpen);
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      if (state.settingsOpen) {
        renderSettingsBody();
      }
    }

    function openSettingsModal() {
      state.settingsOpen = true;
      document.getElementById('settingsModal').classList.remove('hidden');
      renderSettingsBody();
    }

    function closeSettingsModal() {
      state.settingsOpen = false;
      document.getElementById('settingsModal').classList.add('hidden');
    }

    // ================= SPOTLIGHT GLOBAL SEARCH LOGIC =================
    function openSpotlightModal() {
      state.spotlightOpen = true;
      state.spotlightSelectedIndex = 0;
      const modal = document.getElementById('spotlightModal');
      const input = document.getElementById('spotlightInput');
      modal.classList.remove('hidden');
      input.value = '';
      renderSpotlightResults('');
      setTimeout(() => input.focus(), 10);
    }

    function closeSpotlightModal() {
      state.spotlightOpen = false;
      document.getElementById('spotlightModal').classList.add('hidden');
    }

    function buildSpotlightCatalog(query) {
      const q = (query || '').trim().toLowerCase();
      const items = [];

      // 1. All Sessions across Workspaces
      state.workspaces.forEach(ws => {
        ws.sessions.forEach(sess => {
          if (!q || sess.title.toLowerCase().includes(q) || ws.name.toLowerCase().includes(q)) {
            items.push({
              category: 'Sessions',
              title: sess.title,
              subtitle: ws.name,
              icon: 'session',
              action: () => {
                selectSession(ws.id, sess.id);
                closeSpotlightModal();
              }
            });
          }
        });
      });

      // 2. Modified Files & Diffs across Workspaces
      state.workspaces.forEach(ws => {
        ws.sessions.forEach(sess => {
          (sess.diffs || []).forEach(diff => {
            if (!q || diff.fullPath.toLowerCase().includes(q) || ws.name.toLowerCase().includes(q)) {
              items.push({
                category: 'Files & Diffs',
                title: diff.fullPath,
                subtitle: `${ws.name} · +${diff.add} -${diff.del}`,
                icon: 'diff',
                action: () => {
                  selectSession(ws.id, sess.id);
                  openDiffFile(diff.fullPath);
                  closeSpotlightModal();
                }
              });
            }
          });
        });
      });

      // 3. Quick Commands & Appearance
      const commands = [
        {
          category: 'Actions',
          title: 'Toggle Light / Dark Appearance',
          subtitle: '⌘⇧L',
          icon: 'action',
          action: () => {
            toggleTheme();
            closeSpotlightModal();
          }
        },
        {
          category: 'Actions',
          title: 'Open Preferences & Settings',
          subtitle: '⌘,',
          icon: 'action',
          action: () => {
            closeSpotlightModal();
            openSettingsModal();
          }
        },
        {
          category: 'Actions',
          title: 'Spawn Type Checker Sub-Agent',
          subtitle: 'Inspector Tab',
          icon: 'agent',
          action: () => {
            closeSpotlightModal();
            spawnSubagent();
          }
        }
      ];

      commands.forEach(cmd => {
        if (!q || cmd.title.toLowerCase().includes(q) || cmd.category.toLowerCase().includes(q)) {
          items.push(cmd);
        }
      });

      return items.slice(0, 10);
    }

    function renderSpotlightResults(query) {
      const container = document.getElementById('spotlightResults');
      const items = buildSpotlightCatalog(query);
      state.spotlightFilteredItems = items;
      if (state.spotlightSelectedIndex >= items.length) {
        state.spotlightSelectedIndex = 0;
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="py-8 text-center text-[12.5px] text-mut">
            No matching sessions, files, or actions
          </div>
        `;
        return;
      }

      let lastCategory = '';
      let html = '';

      items.forEach((item, idx) => {
        if (item.category !== lastCategory) {
          lastCategory = item.category;
          html += `
            <div class="px-2.5 pt-2 pb-1 text-[10.5px] font-medium text-mut uppercase tracking-wider">
              ${escapeHtml(item.category)}
            </div>
          `;
        }

        const isSelected = idx === state.spotlightSelectedIndex;
        const iconSvg =
          item.icon === 'diff'
            ? getTabIconSvg('diff')
            : item.icon === 'agent'
            ? getTabIconSvg('agent')
            : item.icon === 'session'
            ? `<svg class="w-3.5 h-3.5 text-sec shrink-0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5C2.5 3.67 3.17 3 4 3H12C12.83 3 13.5 3.67 13.5 4.5V10.5C13.5 11.33 12.83 12 12 12H6L3 14V12H4C3.17 12 2.5 11.33 2.5 10.5V4.5Z" stroke-linejoin="round"/></svg>`
            : `<svg class="w-3.5 h-3.5 text-sec shrink-0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2L4 9H8.5L7 14L12 7H7.5L9 2Z" stroke-linejoin="round"/></svg>`;

        html += `
          <button
            onclick="triggerSpotlightItem(${idx})"
            onmouseenter=" updateSpotlightHover(${idx})"
            class="w-full h-[36px] px-3 rounded-[9px] flex items-center justify-between gap-3 text-left transition-colors ${
              isSelected ? 'active-pill text-pri font-medium' : 'text-sec hover:text-pri'
            }"
          >
            <div class="flex items-center gap-2.5 min-w-0">
              ${iconSvg}
              <span class="text-[13px] text-pri truncate">${escapeHtml(item.title)}</span>
            </div>
            <span class="text-[11.5px] font-mono text-mut shrink-0">${escapeHtml(item.subtitle)}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function updateSpotlightHover(idx) {
      if (state.spotlightSelectedIndex === idx) return;
      state.spotlightSelectedIndex = idx;
      const input = document.getElementById('spotlightInput');
      renderSpotlightResults(input ? input.value : '');
    }

    function triggerSpotlightItem(idx) {
      const item = state.spotlightFilteredItems[idx];
      if (item && typeof item.action === 'function') {
        item.action();
      }
    }

    function handleSpotlightKeydown(e) {
      const len = state.spotlightFilteredItems.length;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeSpotlightModal();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (len > 0) {
          state.spotlightSelectedIndex = (state.spotlightSelectedIndex + 1) % len;
          renderSpotlightResults(e.target.value);
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (len > 0) {
          state.spotlightSelectedIndex = (state.spotlightSelectedIndex - 1 + len) % len;
          renderSpotlightResults(e.target.value);
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        triggerSpotlightItem(state.spotlightSelectedIndex);
      }
    }

    function switchSettingsTab(tabKey) {
      state.activeSettingsTab = tabKey;
      const titles = {
        general: 'General',
        models: 'Models',
        execution: 'Execution'
      };
      const titleEl = document.getElementById('settingsCategoryTitle');
      if (titleEl) titleEl.textContent = titles[tabKey] || 'Settings';

      ['general', 'models', 'execution'].forEach(k => {
        const btn = document.getElementById('settingsTab-' + k);
        if (!btn) return;
        if (k === tabKey) {
          btn.className = 'w-full h-[32px] px-2.5 rounded-[8px] flex items-center gap-2.5 text-[12.5px] transition-colors active-pill text-pri font-medium';
        } else {
          btn.className = 'w-full h-[32px] px-2.5 rounded-[8px] flex items-center gap-2.5 text-[12.5px] transition-colors hover-pill text-sec hover:text-pri';
        }
      });
      renderSettingsBody();
    }

    function togglePreference(prefKey) {
      state.preferences[prefKey] = !state.preferences[prefKey];
      renderSettingsBody();
      showToast('Preference saved');
    }

    function renderSwitchHtml(checked, onClickStr) {
      return `
        <button
          onclick="${onClickStr}"
          class="w-[36px] h-[20px] rounded-full p-[2px] transition-colors flex items-center ${
            checked ? 'bg-emerald-500 justify-end' : 'bg-black/15 dark:bg-white/15 justify-start'
          }"
        >
          <span class="w-[16px] h-[16px] rounded-full bg-white shadow-sm block"></span>
        </button>
      `;
    }

    function renderSettingsBody() {
      const container = document.getElementById('settingsModalBody');
      if (!container) return;

      const isDark = document.documentElement.classList.contains('dark');

      if (state.activeSettingsTab === 'general') {
        container.innerHTML = `
          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Appearance</div>
              <div class="text-[11.5px] text-sec">Switch between Light and Dark vibrancy material (⌘⇧L)</div>
            </div>
            <div class="p-0.5 rounded-[8px] bg-black/[0.05] dark:bg-white/[0.06] flex items-center gap-0.5 shrink-0">
              <button
                onclick="if(document.documentElement.classList.contains('dark')) toggleTheme()"
                class="px-2.5 py-1 rounded-[6px] text-[11.5px] flex items-center gap-1.5 transition-all ${!isDark ? 'segment-active text-pri font-medium' : 'text-sec hover:text-pri'}"
              >
                <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                  <circle cx="8" cy="8" r="3.1"/>
                  <path d="M8 1.75V3M8 13V14.25M1.75 8H3M13 8H14.25M3.58 3.58L4.46 4.46M11.54 11.54L12.42 12.42M12.42 3.58L11.54 4.46M4.46 11.54L3.58 12.42" stroke-linecap="round"/>
                </svg>
                <span>Light</span>
              </button>
              <button
                onclick="if(!document.documentElement.classList.contains('dark')) toggleTheme()"
                class="px-2.5 py-1 rounded-[6px] text-[11.5px] flex items-center gap-1.5 transition-all ${isDark ? 'segment-active text-pri font-medium' : 'text-sec hover:text-pri'}"
              >
                <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M13.1 9.7A5.4 5.4 0 0 1 6.3 2.9a5.4 5.4 0 1 0 6.8 6.8Z" stroke-linejoin="round"/>
                </svg>
                <span>Dark</span>
              </button>
            </div>
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Compact Diff View</div>
              <div class="text-[11.5px] text-sec">Collapse unchanged context lines in the right inspector</div>
            </div>
            ${renderSwitchHtml(state.preferences.compactDiffs, "togglePreference('compactDiffs')")}
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Monospace Font</div>
              <div class="text-[11.5px] text-sec">Used for diffs, file paths, and command output</div>
            </div>
            <span class="px-2.5 py-1 rounded-[7px] bg-black/[0.04] dark:bg-white/[0.06] font-mono text-[11.5px] text-pri">SF Mono · 12pt</span>
          </div>
        `;
      } else if (state.activeSettingsTab === 'models') {
        container.innerHTML = `
          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Anthropic API</div>
              <div class="text-[11.5px] text-sec font-mono">sk-ant-api03-••••••••9x2A</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">Connected</span>
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">OpenAI API</div>
              <div class="text-[11.5px] text-sec font-mono">sk-proj-••••••••4kL1</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">Connected</span>
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Local Ollama Endpoint</div>
              <div class="text-[11.5px] text-sec font-mono">http://127.0.0.1:11434</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-black/[0.05] dark:bg-white/[0.06] text-sec">Standby</span>
          </div>
        `;
      } else if (state.activeSettingsTab === 'execution') {
        container.innerHTML = `
          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Auto-approve Read & Search</div>
              <div class="text-[11.5px] text-sec">Allow file reads and AST queries without prompting</div>
            </div>
            ${renderSwitchHtml(state.preferences.autoApproveRead, "togglePreference('autoApproveRead')")}
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Sandbox Outbound Network</div>
              <div class="text-[11.5px] text-sec">Permit test commands to access external hosts</div>
            </div>
            ${renderSwitchHtml(state.preferences.sandboxNetwork, "togglePreference('sandboxNetwork')")}
          </div>

          <div class="p-3.5 rounded-[11px] surface-flat flex items-center justify-between gap-4">
            <div>
              <div class="text-[13px] font-medium text-pri">Parallel Sub-Agents Limit</div>
              <div class="text-[11.5px] text-sec">Maximum concurrent worker agents per session</div>
            </div>
            <span class="px-2.5 py-1 rounded-[7px] bg-black/[0.04] dark:bg-white/[0.06] font-mono text-[11.5px] text-pri">${state.preferences.maxSubagents} workers</span>
          </div>
        `;
      }
    }

    let toastTimeout = null;
    function showToast(text) {
      const pill = document.getElementById('toastPill');
      document.getElementById('toastText').textContent = text;
      pill.classList.remove('opacity-0', 'translate-y-2');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        pill.classList.add('opacity-0', 'translate-y-2');
      }, 2000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatProse(str) {
      return escapeHtml(str)
        .replace(
          /`([^`]+)`/g,
          (match, code) => {
            const isFile = code.includes('.') || code.includes('/');
            if (isFile) {
              return `<button onclick="openDiffFile('${code}')" class="px-1.5 py-0.5 rounded-md font-mono text-[12px] surface-flat text-pri hover:opacity-80 transition-opacity">${code}</button>`;
            }
            return `<code class="px-1.5 py-0.5 rounded-md font-mono text-[12px] surface-flat text-pri">${code}</code>`;
          }
        )
        .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-medium text-pri">$1</strong>');
    }

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (state.spotlightOpen) closeSpotlightModal();
        else openSpotlightModal();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        toggleSidebar();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (!state.sidebarOpen) toggleSidebar();
        toggleSidebarSearch(true);
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        toggleRightSidebar();
      } else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        toggleTheme();
      } else if ((e.metaKey || e.ctrlKey) && e.key === ',') {
        e.preventDefault();
        if (state.settingsOpen) closeSettingsModal();
        else openSettingsModal();
      } else if (e.key === 'Escape') {
        document.getElementById('contextDropdown').classList.add('hidden');
        if (state.spotlightOpen) closeSpotlightModal();
        if (state.settingsOpen) closeSettingsModal();
      }
    });

    window.addEventListener('click', () => {
      document.getElementById('contextDropdown').classList.add('hidden');
    });

    window.onload = () => {
      renderWorkspaceTree();
      renderCenterSessionTabs();
      renderMainStream();
      renderComposerContext();
      renderRightSidebar();
    };
  </script>
</body>
</html>
